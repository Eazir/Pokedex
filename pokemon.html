<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pokemon.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dex-body">
        <div class="dex-hinge"></div>
        <div class="dex-top">
            <div class="dex-leds">
                <span class="led led-scarlet"></span>
                <span class="led led-blue"></span>
                <span class="led led-gold"></span>
            </div>
            <div class="screen-bezel">
                <div class="pantalla" style="height:280px">
                    <div class="ficha">
                        <span id="numero-pokemon">#000</span>
                        <div class="pokemon-imagen-wrapper">
                            <img id="imagen-pokemon" src="" alt="">
                        </div>
                        <h1 id="nombre-pokemon"></h1>
                        <div id="tipos-pokemon"></div>
                    </div>
                    <div class="pantalla-scanline"></div>
                </div>
                <div class="screen-brand">POKéDEX</div>
            </div>
        </div>
        <div class="dex-divider">
            <div class="divider-notch"></div>
        </div>
        <div class="dex-bottom pokemon-page">
            <a href="javascript:history.back()" class="pokemon-back">← Volver</a>
            <div id="stats-pokemon"></div>
            <div id="evoluciones-pokemon"></div>
            <footer class="dex-footer">
                <p>Creado por <span>Eazir / Sebastian David</span></p>
                <p>Datos de <a href="https://pokeapi.co" target="_blank">PokéAPI</a> · Pokémon © Nintendo</p>
            </footer>
        </div>
    </div>
    <script src="js/pokemon.js"></script>
</body>
</html>
