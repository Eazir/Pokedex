<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/region.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dex-body">
        <div class="dex-hinge"></div>
        <div class="dex-top">
            <div class="dex-leds">
                <span class="led led-scarlet"></span>
                <span class="led led-blue"></span>
                <span class="led led-gold"></span>
            </div>
            <div class="screen-bezel">
                <div class="pantalla" style="height:auto; min-height:200px; padding:10px">
                    <div class="region-header">
                        <a href="index.html">← Inicio</a>
                        <h1 id="nombre-region">Region</h1>
                    </div>
                    <nav id="menu-regiones"></nav>
                    <input type="text" id="buscador" placeholder="Buscar Pokémon...">
                    <div class="pantalla-scanline"></div>
                </div>
                <div class="screen-brand">POKéDEX</div>
            </div>
        </div>
        <div class="dex-divider">
            <div class="divider-notch"></div>
        </div>
        <div class="dex-bottom region-page">
            <section class="lista-pokemon">
            </section>
            <footer class="dex-footer">
             <p>Creado por <span>Eazir / Sebastian David</span></p>
             <p>Datos de <a href="https://pokeapi.co" target="_blank">PokéAPI</a> · Pokémon © Nintendo</p>
            </footer>
        </div>
    </div>
    <script src="js/regiones.js"></script>
    <script src="js/region.js"></script>
</body>
</html>
