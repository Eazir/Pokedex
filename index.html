<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="contenedor">
            <header>
                <h1>Pokedex</h1>
            </header>
            <div class="pantalla">
                <img src="" alt="Starter">
            </div>
            <section class="regiones">
                <button data-region="kanto">I. Kanto</button>
                <button data-region="johto">II. Johto</button>
                <button data-region="hoenn">III. Hoenn</button>
                <button data-region="sinnoh">IV. Sinnoh</button>
                <button data-region="unova">V. Unova</button>
                <button data-region="kalos">VI. Kalos</button>
                <button data-region="alola">VII. Alola</button>
                <button data-region="galar">VIII. Galar</button>
                <button data-region="paldea">IX. Paldea</button>
                <button data-region="proximamente">X. ???</button>
            </section>
            <section class="nacional">
                <button data-region="nacional">Pokedex Nacional</button>
            </section>
            <footer>
                <p>Creado por <span>Jaire /Kevin Aguirre</span></p>
                <p>Datos obtenidos de <a href="https://pokeapi.co" target="_blank">PokéAPI</a></p>
                <p>Pokémon © Nintendo / Game Freak / Creatures Inc.</p>
            </footer>
        </div>
    </main>
    <script src="js/regiones.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
